<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💋Ale🩺 - Flores Amarillas</title>

  <!-- Enlace a los estilos oficiales de las flores -->
  <link rel="stylesheet" href="https://fumifathy.github.io/flores-youlove-rk6ui/css/main.css">
  <link rel="icon" href="https://fumifathy.github.io/flores-youlove-rk6ui/img/flowers.png" type="image/x-icon">

  <style>
    /* Efecto de caída de polen/estrellitas amarillas */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ffff00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
      animation: fall linear infinite;
      z-index: 10;
    }

    @keyframes fall {
      0% { transform: translateY(-100px) translateX(0); }
      100% { transform: translateY(100vh) translateX(30px); }
    }

    .container {
      position: relative;
      overflow: hidden;
    }

    /* Aura luminosa de fondo */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300vw;
      height: 170vh;
      background: radial-gradient(
        circle,
        rgba(255, 235, 59, 0.12) 0%,
        rgba(255, 193, 7, 0.08) 40%,
        rgba(0, 0, 0, 0) 70%
      );
      border-radius: 50%;
      z-index: -1;
      opacity: 0.8;
      animation: aura-expand 8s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes aura-expand {
      0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
    }

    .flowers {
      position: relative;
      z-index: 5;
    }

    /* Estilo del texto que se escribe primero */
    .aura-text {
      position: fixed;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      z-index: 25;
      pointer-events: none;
      width: 90%;
      max-width: 850px;
      padding: 0 15px;
      box-sizing: border-box;
      line-height: 1.5;
    }

    .aura-text span {
      display: inline-block;
      color: #ffd700;
      text-shadow: 0 0 10px #ffeb3b, 0 0 20px #ffd700;
      font-size: 20px;
      opacity: 0;
      transform: translateY(15px);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 22px;
      background-color: #ffd700;
      margin-left: 4px;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Estilo del mensaje final */
    .final-message {
      position: fixed;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 15px #ffd700;
      opacity: 0;
      z-index: 30;
      pointer-events: none;
      font-size: 19px;
      line-height: 1.6;
      white-space: pre-line;
      max-width: 850px;
      width: 90%;
      padding: 0 15px;
      box-sizing: border-box;
      transition: opacity 1.2s ease-in-out;
    }

    .final-message.active {
      color: #fffb8f;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ff9800;
    }

    /* Tallos verdes bien definidos */
    .flower__line {
      background-color: #107b17 !important;
      box-shadow: 0 0 5px #107b17, 0 0 10px #107b17 !important;
    }

    /* Resplandor amarillo que sube */
    .flower-aura {
      position: fixed;
      bottom: -100vh;
      left: 50%;
      transform: translateX(-50%);
      width: 1200px;
      height: 150vh;
      background: linear-gradient(to top, rgba(255, 235, 59, 0.85) 0%, rgba(255, 193, 7, 0.5) 30%, rgba(255, 152, 0, 0.2) 60%, transparent 90%);
      border-radius: 50% 50% 0 0;
      filter: blur(35px);
      z-index: 15;
      opacity: 1;
      transition: bottom 2s ease-out;
    }
  </style>
</head>

  <!-- Audio funcional directo del ejemplo -->
  <audio id="background-music" loop>
    <source src="https://fumifathy.github.io/flores-youlove-rk6ui/audio.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <script>
    // Iniciar apertura y música
    window.addEventListener("load", () => {
      document.body.classList.remove("container");

      const backgroundMusic = document.getElementById("background-music");
      backgroundMusic.play().catch(() => {
        console.log("Se requiere clic para iniciar el audio.");
      });

      // Asegurar que al primer toque en la pantalla suene la música
      document.body.addEventListener("click", () => {
        backgroundMusic.play();
      }, { once: true });

      // Iniciar efectos a los pocos segundos
      setTimeout(startParticles, 2500);
      setTimeout(startEffectsSequence, 5500);
    });

    let PARTICLE_INTENSITY = 45;
    let PARTICLE_SPAWN_RATE = 500;
    const PARTICLE_SPEED = 0.5;

    function startParticles() {
      for (let i = 0; i < PARTICLE_INTENSITY; i++) {
        createParticle();
      }
      setInterval(createParticle, PARTICLE_SPAWN_RATE);
    }

    function createParticle() {
      const particles = document.getElementById('particles');
      if (!particles) return;
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 4 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.opacity = Math.random() * 0.7 + 0.3;
      particle.style.left = (Math.random() * 100) + 'vw';
      const duration = Math.random() * PARTICLE_SPEED + 3.5;
      particle.style.animationDuration = duration + 's';
      particles.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, duration * 1000);
    }

    function startEffectsSequence() {
      const aura = document.createElement('div');
      aura.className = 'flower-aura';
      document.body.appendChild(aura);

      setTimeout(() => { aura.style.bottom = '0'; }, 50);
      setTimeout(showHackerText, 1800);
    }

    function showHackerText() {
      // Mensaje con espacios y formato ordenado
      const typingMessage = "💋 Ale 🩺: Amor, te adoro. Hay miles de cosas que desearía decirte, pero lo más importante es que quiero que sepas que te quiero y no hay nadie en esta vida con quien desearía compartir mi vida. Gracias por ser tú.";

      const finalMsgText = "💋 Ale 🩺\n\nAmor, sé que no es lo que esperas, pero no tener tiempo para coordinar una entrega no significa que no haga nada.\n\n¡TE QUIERO AMOR, MUCHO! ❤️";

      const auraText = document.getElementById('aura-text');
      const finalMessage = document.getElementById('final-message');
      
      // Permitir que los espacios se respeten visualmente
      auraText.style.whiteSpace = 'pre-wrap';
      auraText.style.opacity = '1';

      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      auraText.appendChild(cursor);

      // Array.from evita romper los emojis complejos
      const characters = Array.from(typingMessage);
      let currentIndex = 0;

      function showNextCharacter() {
        if (currentIndex < characters.length) {
          const char = characters[currentIndex];
          const span = document.createElement('span');
          
          // Si es espacio, se coloca un espacio no separable (&nbsp;) para que no se pegue
          span.innerHTML = char === ' ' ? '&nbsp;' : char;
          
          auraText.insertBefore(span, cursor);
          setTimeout(() => { span.style.opacity = '1'; }, 20);
          currentIndex++;
          setTimeout(showNextCharacter, 75);
        } else {
          cursor.remove();
          setTimeout(() => {
            auraText.style.transition = 'opacity 1s ease-out';
            auraText.style.opacity = '0';
            setTimeout(() => {
              finalMessage.textContent = finalMsgText;
              finalMessage.style.opacity = '1';
              finalMessage.classList.add('active');
            }, 1000);
          }, 3500);
        }
      }
      showNextCharacter();
    }
  </script>
