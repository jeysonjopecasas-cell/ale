<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💋 Ale 🩺 - Flores Amarillas</title>

  <!-- Estilos base de las flores -->
  <link rel="stylesheet" href="https://fumifathy.github.io/flores-youlove-rk6ui/css/main.css">
  <link rel="icon" href="https://fumifathy.github.io/flores-youlove-rk6ui/img/flowers.png" type="image/x-icon">

  <style>
    /* Partículas amarillas flotantes */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ffff00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
      animation: fall linear infinite;
      z-index: 10;
    }

    @keyframes fall {
      0% { transform: translateY(-100px) translateX(0); }
      100% { transform: translateY(100vh) translateX(30px); }
    }

    .container {
      position: relative;
      overflow: hidden;
    }

    /* Aura nocturna sutil original (fondo oscuro) */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300vw;
      height: 170vh;
      background: radial-gradient(
        circle,
        rgba(138, 43, 226, 0.12) 0%,
        rgba(75, 0, 130, 0.08) 40%,
        rgba(0, 0, 0, 0) 70%
      );
      border-radius: 50%;
      z-index: -1;
      opacity: 0.7;
      animation: aura-expand 8s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes aura-expand {
      0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
    }

    .flowers {
      position: relative;
      z-index: 5;
    }

    /* Texto 1: Escritura hacker roja idéntica al ejemplo */
    .aura-text {
      position: fixed;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      width: 90%;
      max-width: 900px;
      padding: 0 15px;
      box-sizing: border-box;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .aura-text span {
      display: inline-block;
      color: #ff2a2a;
      text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 35px #cc0000;
      font-size: 23px;
      opacity: 0;
      transform: translateY(12px);
    }

    /* Cursor parpadeante rojo */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 24px;
      background-color: #ff2a2a;
      box-shadow: 0 0 8px #ff0000;
      margin-left: 4px;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Texto 2: Mensaje final con pulso rojo neón del ejemplo */
    .final-message {
      position: fixed;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      z-index: 30;
      pointer-events: none;
      font-size: 22px;
      line-height: 1.6;
      white-space: pre-line;
      max-width: 850px;
      width: 90%;
      padding: 0 15px;
      box-sizing: border-box;
      transition: opacity 1s ease-in-out;
      color: #ff1a1a;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 80px #ff0000;
    }

    .final-message.active {
      animation: text-pulse 0.6s infinite alternate;
    }

    @keyframes text-pulse {
      from {
        text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
      }
      to {
        text-shadow: 0 0 30px #ff3333, 0 0 60px #ff3333, 0 0 90px #ff0000, 0 0 110px #ff0000;
      }
    }

    /* Tallos verdes limpios */
    .flower__line {
      background-color: #107b17 !important;
      box-shadow: 0 0 5px #107b17, 0 0 10px #107b17 !important;
    }
  </style>
</head>

  <div class="final-message" id="final-message"></div>

  <!-- Audio -->
  <audio id="background-music" loop>
    <source src="https://fumifathy.github.io/flores-youlove-rk6ui/audio.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <script>
    window.addEventListener("load", () => {
      // Inicia animación de apertura
      document.body.classList.remove("container");

      const backgroundMusic = document.getElementById("background-music");
      backgroundMusic.play().catch(() => {});

      // Inicia música al primer clic
      document.body.addEventListener("click", () => {
        backgroundMusic.play();
      }, { once: true });

      // Partículas y texto
      setTimeout(startParticles, 2500);
      setTimeout(startEffectsSequence, 5000);
    });

    let PARTICLE_INTENSITY = 45;
    let PARTICLE_SPAWN_RATE = 500;
    const PARTICLE_SPEED = 0.5;

    function startParticles() {
      for (let i = 0; i < PARTICLE_INTENSITY; i++) {
        createParticle();
      }
      setInterval(createParticle, PARTICLE_SPAWN_RATE);
    }

    function createParticle() {
      const particles = document.getElementById('particles');
      if (!particles) return;
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 4 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.opacity = Math.random() * 0.7 + 0.3;
      particle.style.left = (Math.random() * 100) + 'vw';
      const duration = Math.random() * PARTICLE_SPEED + 3.5;
      particle.style.animationDuration = duration + 's';
      particles.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, duration * 1000);
    }

    function startEffectsSequence() {
      // Muestra el texto directamente sobre el fondo oscuro limpio
      showHackerText();
    }

    function showHackerText() {
      const typingMessage = "💋 Ale 🩺\n\nAmor, te adoro. Hay miles de cosas que desearía decirte, pero lo más importante es que quiero que sepas que te quiero y no hay nadie en esta vida con quien desearía compartir mi vida. Gracias por ser tú ❤️";

      const finalMsgText = "💋 Ale 🩺\n\nAmor, sé que no es lo que esperas, pero no tener tiempo para coordinar una entrega no significa que no haga nada.\n\n¡TE QUIERO AMOR, MUCHO! ❤️";

      const auraText = document.getElementById('aura-text');
      const finalMessage = document.getElementById('final-message');
      
      auraText.style.opacity = '1';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      auraText.appendChild(cursor);

      // Usar Array.from protege los emojis para que no se corrompan
      const characters = Array.from(typingMessage);
      let currentIndex = 0;

      function showNextCharacter() {
        if (currentIndex < characters.length) {
          const char = characters[currentIndex];
          const span = document.createElement('span');
          
          // Mantiene los espacios intactos entre palabras
          span.innerHTML = char === ' ' ? '&nbsp;' : char;
          
          auraText.insertBefore(span, cursor);
          setTimeout(() => { span.style.opacity = '1'; }, 20);
          currentIndex++;
          setTimeout(showNextCharacter, 75);
        } else {
          cursor.remove();
          // Espera 3.5 segundos y cambia al mensaje con pulso neón
          setTimeout(() => {
            auraText.style.transition = 'opacity 1s ease-out';
            auraText.style.opacity = '0';
            setTimeout(() => {
              finalMessage.textContent = finalMsgText;
              finalMessage.style.opacity = '1';
              finalMessage.classList.add('active');
            }, 1000);
          }, 3500);
        }
      }
      showNextCharacter();
    }
  </script>
</body>
</html>
