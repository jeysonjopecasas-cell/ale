<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💋 Ale 🩺 - Flores Amarillas</title>

  <!-- Estilos base de las flores -->
  <link rel="stylesheet" href="https://fumifathy.github.io/flores-youlove-rk6ui/css/main.css">
  <link rel="icon" href="https://fumifathy.github.io/flores-youlove-rk6ui/img/flowers.png" type="image/x-icon">

  <style>
    /* Partículas amarillas flotantes */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ffff00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
      animation: fall linear infinite;
      z-index: 10;
    }

    @keyframes fall {
      0% { transform: translateY(-100px) translateX(0); }
      100% { transform: translateY(100vh) translateX(30px); }
    }

    .container {
      position: relative;
      overflow: hidden;
    }

    /* Fondo nocturno limpio con aura sutil */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300vw;
      height: 170vh;
      background: radial-gradient(
        circle,
        rgba(138, 43, 226, 0.12) 0%,
        rgba(75, 0, 130, 0.08) 40%,
        rgba(0, 0, 0, 0) 70%
      );
      border-radius: 50%;
      z-index: -1;
      opacity: 0.7;
      animation: aura-expand 8s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes aura-expand {
      0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
    }

    .flowers {
      position: relative;
      z-index: 5;
    }

    /* Contenedor del texto mecanografiado */
    .aura-text {
      position: fixed;
      top: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      z-index: 25;
      pointer-events: none;
      width: 92%;
      max-width: 900px;
      padding: 0 15px;
      box-sizing: border-box;
      line-height: 1.6;
    }

    /* Cada palabra se mantiene junta (evita partir "decirte" o "vida") */
    .aura-word {
      display: inline-block;
      white-space: nowrap;
      margin-right: 7px;
    }

    /* Estilo de las letras: Núcleo blanco/rosa con contorno y resplandor rojo */
    .aura-char {
      display: inline-block;
      color: #fff2f2;
      -webkit-text-stroke: 0.8px #200003;
      text-shadow: 
        0 0 5px #ff0033,
        0 0 12px #ff0033,
        0 0 25px #d40029,
        0 0 45px #800018;
      font-size: 21px;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    /* Cursor parpadeante */
    .cursor {
      display: inline-block;
      width: 9px;
      height: 24px;
      background-color: #ff1a40;
      box-shadow: 0 0 10px #ff0033;
      margin-left: 3px;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Mensaje final con pulso neón y máxima nitidez */
    .final-message {
      position: fixed;
      top: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      z-index: 30;
      pointer-events: none;
      font-size: 21px;
      line-height: 1.7;
      white-space: pre-line;
      max-width: 850px;
      width: 92%;
      padding: 0 15px;
      box-sizing: border-box;
      transition: opacity 1.5s ease-in-out;
      color: #fff2f2;
      -webkit-text-stroke: 0.8px #200003;
      text-shadow: 
        0 0 8px #ff0033,
        0 0 20px #ff0033,
        0 0 45px #cc0029;
    }

    .final-message.active {
      animation: text-pulse 0.7s infinite alternate;
    }

    @keyframes text-pulse {
      from {
        text-shadow: 
          0 0 6px #ff0033,
          0 0 15px #ff0033,
          0 0 30px #b30024;
      }
      to {
        text-shadow: 
          0 0 10px #ff2b52,
          0 0 25px #ff0033,
          0 0 50px #ff0033,
          0 0 75px #99001f;
      }
    }

    /* Tallos verdes */
    .flower__line {
      background-color: #107b17 !important;
      box-shadow: 0 0 5px #107b17, 0 0 10px #107b17 !important;
    }
  </style>
</head>

  <!-- Audio -->

    Tu navegador no soporta audio.
  </audio>

  <script>
    window.addEventListener("load", () => {
      document.body.classList.remove("container");

      const backgroundMusic = document.getElementById("background-music");
      backgroundMusic.play().catch(() => {});

      document.body.addEventListener("click", () => {
        backgroundMusic.play();
      }, { once: true });

      setTimeout(startParticles, 2500);
      setTimeout(startTypingSequence, 4500);
    });

    let PARTICLE_INTENSITY = 45;
    let PARTICLE_SPAWN_RATE = 500;
    const PARTICLE_SPEED = 0.5;

    function startParticles() {
      for (let i = 0; i < PARTICLE_INTENSITY; i++) {
        createParticle();
      }
      setInterval(createParticle, PARTICLE_SPAWN_RATE);
    }

    function createParticle() {
      const particles = document.getElementById('particles');
      if (!particles) return;
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 4 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.opacity = Math.random() * 0.7 + 0.3;
      particle.style.left = (Math.random() * 100) + 'vw';
      const duration = Math.random() * PARTICLE_SPEED + 3.5;
      particle.style.animationDuration = duration + 's';
      particles.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, duration * 1000);
    }

    function startTypingSequence() {
      // Texto 1 con salto de línea antes de "Gracias por ser tú"
      const text1 = "💋 Ale 🩺: Amor, te adoro. Hay miles de cosas que desearía decirte, pero lo más importante es que quiero que sepas que te quiero y no hay nadie en esta vida con quien desearía compartir mi vida.\n\nGracias por ser tú ❤️";

      // Texto 2 final
      const text2 = "💋 Ale 🩺\n\nAmor, sé que no es lo que esperas, pero no tener tiempo para coordinar una entrega no significa que no haga nada.\n\n¡TE QUIERO AMOR, MUCHO! ❤️";

      const auraText = document.getElementById('aura-text');
      const finalMessage = document.getElementById('final-message');
      
      auraText.style.opacity = '1';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      auraText.appendChild(cursor);

      // Separamos por líneas para respetar los saltos
      const lines = text1.split('\n');
      let lineIndex = 0;
      let wordIndex = 0;
      let charIndex = 0;
      let currentWordSpan = null;
      let currentWords = lines[0].split(' ').filter(w => w.length > 0);

      function typeNext() {
        if (lineIndex < lines.length) {
          // Si es una línea vacía (un salto doble)
          if (lines[lineIndex] === '') {
            auraText.insertBefore(document.createElement('br'), cursor);
            lineIndex++;
            if (lineIndex < lines.length) {
              currentWords = lines[lineIndex].split(' ').filter(w => w.length > 0);
              wordIndex = 0;
              charIndex = 0;
            }
            setTimeout(typeNext, 200);
            return;
          }

          if (wordIndex < currentWords.length) {
            const word = currentWords[wordIndex];
            const wordChars = Array.from(word);

            // Crear contenedor de la palabra para que nunca se divida
            if (charIndex === 0) {
              currentWordSpan = document.createElement('span');
              currentWordSpan.className = 'aura-word';
              auraText.insertBefore(currentWordSpan, cursor);
            }

            // Escribir letra
            const charSpan = document.createElement('span');
            charSpan.className = 'aura-char';
            charSpan.textContent = wordChars[charIndex];
            currentWordSpan.appendChild(charSpan);

            setTimeout(() => {
              charSpan.style.opacity = '1';
              charSpan.style.transform = 'translateY(0)';
            }, 10);

            charIndex++;
            if (charIndex >= wordChars.length) {
              // Fin de la palabra
              wordIndex++;
              charIndex = 0;
            }
            setTimeout(typeNext, 70);
          } else {
            // Fin de la línea
            lineIndex++;
            if (lineIndex < lines.length) {
              auraText.insertBefore(document.createElement('br'), cursor);
              currentWords = lines[lineIndex].split(' ').filter(w => w.length > 0);
              wordIndex = 0;
              charIndex = 0;
            }
            setTimeout(typeNext, 150);
          }
        } else {
          // Finalizó de escribirse todo el primer texto
          cursor.remove();
          
          // PAUSA DE 8 SEGUNDOS: Tiempo completo y tranquilo para leer
          setTimeout(() => {
            auraText.style.transition = 'opacity 1.5s ease-out';
            auraText.style.opacity = '0';
            setTimeout(() => {
              finalMessage.textContent = text2;
              finalMessage.style.opacity = '1';
              finalMessage.classList.add('active');
            }, 1200);
          }, 8000);
        }
      }

      typeNext();
    }
  </script>
